name: Packager

on:
  push:
    tags:
      - 'v*'
      - 'release-*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release
    env:
      # Set these secrets in your repository settings (Settings > Secrets and variables > Actions)
      CF_API_KEY: ${{ secrets.CF_API_KEY }}   # CurseForge API Token
      # WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }} # Wago.io API Token
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for changelog generation

      - name: Package and Release
        uses: BigWigsMods/packager@v2
        with:
          args: -n sfui
          # The packager automatically handles:
          # 1. Reading .pkgmeta
          # 2. Downloading externals (Libs)
          # 3. Zipping the addon
          # 4. Creating a GitHub Release
          # 5. Uploading to CF/Wago if tokens are present

      - name: Prune Previous GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          echo "Pruning older releases (keeping $CURRENT_TAG)..."
          gh release list --limit 1000 --json tagName --jq ".[] | select(.tagName != \"$CURRENT_TAG\") | .tagName" | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting old release $tag..."
              gh release delete "$tag" -y || true
            fi
          done

